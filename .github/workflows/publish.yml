name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check version
        shell: bash
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "incrededup") | .version')"
          expected_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$expected_version" ]; then
            echo "Cargo.toml version $crate_version does not match release version $expected_version" >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: CLI docs are generated
        run: |
          cargo run --example generate_cli_docs
          git diff --exit-code README.md docs/cli.md

      - name: Test
        run: cargo test --all-targets

      - name: Doctest
        run: cargo test --doc

      - name: Publish dry run
        run: cargo publish --dry-run --locked

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
