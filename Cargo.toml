[package]
name = "incrededup"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "Incremental document deduplication using MinHash LSH"
readme = "README.md"
repository = "https://github.com/mpr1255/incrededup"
homepage = "https://github.com/mpr1255/incrededup"
documentation = "https://docs.rs/incrededup"
license = "MIT OR Apache-2.0"
keywords = ["deduplication", "minhash", "lsh", "postgres", "sqlite"]
categories = ["command-line-utilities", "database"]
exclude = ["scripts/"]

[dependencies]
# PostgreSQL
tokio = { version = "1.0", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
deadpool-postgres = "0.14"
postgres-types = { version = "0.2", features = ["with-uuid-1"] }

# Storage - pure Rust embedded DB
redb = "2.1"

# Parallelism
rayon = "1.10"
crossbeam = "0.8"

# Hashing for the Rensa-derived MinHash implementation
rustc-hash = "2.0"

# Random number generation for the Rensa-derived MinHash implementation
rand = "0.8"
rand_xoshiro = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Time/date handling
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Progress reporting
indicatif = "0.17"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID handling
uuid = { version = "1.11", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"

# Environment loading
dotenvy = "0.15"

# System info
num_cpus = "1.16"

# Temp files for testing
tempfile = "3.14"

# Async traits
async-trait = "0.1"

# SQLite support (for testing and alternative data source)
rusqlite = { version = "0.32", features = ["bundled", "uuid"] }
futures = "0.3.31"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
